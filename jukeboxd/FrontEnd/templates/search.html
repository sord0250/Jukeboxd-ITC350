<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | jukeboxd</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/jb_favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
    {% include "components/navbar.html" %}

    <main class="search_page">
        <section class="search_shell">
            <div class="search_intro">
                <p class="search_eyebrow">Discover</p>
                <h1 class="search_title">Search albums, songs, and artists</h1>
                <p class="search_subtitle">Search the catalog and click any result to see the most liked community reviews connected to it.</p>
            </div>

            <div class="search_bar_wrap">
                <label class="sr_only" for="search-input">Search music</label>
                <input
                    id="search-input"
                    class="search_input"
                    type="search"
                    placeholder="Try 'Adam', 'Diary', or 'SZA'"
                    autocomplete="off"
                >
            </div>

            <div class="search_meta">
                <span id="search-count" class="search_count">Start typing to search</span>
                <span class="search_hint">Live results update as you type</span>
            </div>

            <section id="search-results" class="search_results" aria-live="polite"></section>
        </section>
    </main>

    <div id="detail-modal" class="modal_overlay" hidden>
        <div class="modal_shell modal_shell_detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <button id="detail-close" class="modal_close" type="button" aria-label="Close details">&times;</button>
            <div id="detail-content"></div>
        </div>
    </div>

    {% include "components/scripts.html" %}
</body>
</html>

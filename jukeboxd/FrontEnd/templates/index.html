<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jukeboxd</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

</head>
<body>
    {% include "components/navbar.html" %}

    <main class="feed_page">
        <section class="feed_welcome">
            <h1 class="feed_welcome_title">Welcome to Jukeboxd</h1>
            <p class="feed_welcome_copy">
                A polished home for thoughtful music discovery, sharp opinions, and the records worth talking about.
                Settle in, explore the feed, and see what is resonating with the community right now.
            </p>
            <div class="feed_filter_bar" role="tablist" aria-label="Filter feed reviews">
                <button class="feed_filter_button is-active" type="button" data-feed-filter="all" aria-pressed="true">All</button>
                <button class="feed_filter_button" type="button" data-feed-filter="album" aria-pressed="false">Album</button>
                <button class="feed_filter_button" type="button" data-feed-filter="song" aria-pressed="false">Song</button>
                <button class="feed_filter_button" type="button" data-feed-filter="artist" aria-pressed="false">Artist</button>
            </div>
        </section>
        <section id="feed-list" class="feed_list" aria-live="polite"></section>
        <div id="feed-scroll-trigger" class="feed_scroll_trigger" aria-hidden="true"></div>
        <button id="feed-back-to-top" class="feed_back_to_top_button" type="button" aria-label="Back to top">
            <img class="feed_back_to_top_icon" src="{{ url_for('static', filename='img/jb_back_to_top.svg') }}" alt="">
        </button>
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | jukeboxd</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body class="add_body">
    {% include "components/navbar.html" %}

    <main class="add_page">
        <section class="add_shell">
            <div class="add_intro">
                <p class="add_eyebrow">Account</p>
                <h1 class="add_title">Login</h1>
                <p class="add_subtitle">Sign in to write reviews, like posts, and build your profile.</p>
            </div>

            <form id="login-form" class="add_form" novalidate>
                <section class="add_panel">
                    <div class="add_panel_header">
                        <h2 class="add_section_title">Email</h2>
                        <p class="add_section_copy">Enter your account email.</p>
                    </div>

                    <input
                        id="login-email"
                        class="search_input add_search_input"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >
                </section>

                <section class="add_panel">
                    <div class="add_panel_header">
                        <h2 class="add_section_title">Password</h2>
                        <p class="add_section_copy">Enter your password.</p>
                    </div>

                    <input
                        id="login-password"
                        class="search_input add_search_input"
                        type="password"
                        placeholder="Password"
                        required
                    >
                </section>

                <div class="add_actions">
                    <p id="login-message" class="add_form_message"></p>
                    <button class="add_submit_button" type="submit">Login</button>
                </div>
            </form>
        </section>
    </main>

    {% include "components/scripts.html" %}
</body>
</html>
